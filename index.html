<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
    <script src="./index.js" defer></script> <!-- defer is for the script being loaded last -->
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <h1>Javascript</h1>
    <h3 id="myH1">Enter the radius of a circle:</h3>
    <label >radius:</label>
    <input type="text" id="myText">
    <button id="mySubmit">Submit</button> <br> <br>
    <h3 id="myH3"></h3>
    <hr>
    <h1 style="text-align: center;">Counter:</h1>

        <button id="resetBtn" class="buttons">reset</button>

    </div> <br>
    <hr>
